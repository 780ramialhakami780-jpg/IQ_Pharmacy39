name: Build IQ_Pharmacy39 (Icon + Android + iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restore Permanent Signing Certificate
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore /tmp/temp.jks
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \n\r' | base64 -d > /tmp/temp.jks
          keytool -importkeystore -srckeystore /tmp/temp.jks -srcstorepass "${{ secrets.KEYSTORE_PASSWORD }}" -srcalias "${{ secrets.KEY_ALIAS }}" -destkeystore ~/.android/debug.keystore -deststorepass android -destkeypass android -destalias androiddebugkey -noprompt
          rm -f /tmp/temp.jks

      - name: Initialize Platforms
        run: flutter create . --platforms=android,web --org ye.su --project-name iq_pharmacy39

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build Lightweight Android APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APK Signature
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Build iOS & Web PWA
        run: flutter build web --release --base-href "/IQ_Pharmacy39/"

      - name: Publish Direct APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: IQ_Pharmacy39 Official Release
          files: build/app/outputs/flutter-apk/app-*-release.apk
          overwrite_files: true

      - name: Upload Web App for iOS
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy_ios_web:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
