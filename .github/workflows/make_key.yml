name: Generate Permanent Keystore
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore and Base64
        run: |
          keytool -genkey -v -keystore pharmacy39.jks -keyalg RSA -keysize 2048 -validity 10000 -alias pharmacy39 -storepass Pharmacy392026 -keypass Pharmacy392026 -dname "CN=IQ_Pharmacy39, OU=Pharmacy, O=SanaaUniversity, L=Sanaa, S=Sanaa, C=YE"
          base64 -w 0 pharmacy39.jks > keystore_base64.txt
      - name: Upload Keystore Text
        uses: actions/upload-artifact@v4
        with:
          name: keystore_base64
          path: keystore_base64.txt
